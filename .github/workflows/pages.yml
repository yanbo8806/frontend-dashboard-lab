name: 手动部署 GitHub Pages

# 作者确认素材许可并在仓库 Settings → Pages 选择 GitHub Actions 后手动运行。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - run: npm run setup
      - run: npm test
      - run: npm run release:check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
